name: Validate Hugo landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go 1.27.2
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Install Hugo extended 0.168.0
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          go version
          hugo version
      - name: Build preview only (never deploy)
        run: hugo --minify --destination /tmp/orioninsist-preview
      - name: Verify single-page output
        run: |
          test -s /tmp/orioninsist-preview/index.html
          test "$(find /tmp/orioninsist-preview -name '*.html' | wc -l)" -eq 1
          grep -q 'SOC Analyst Journey' /tmp/orioninsist-preview/index.html
          test -s /tmp/orioninsist-preview/sitemap.xml
          test -s /tmp/orioninsist-preview/robots.txt
          grep -q 'https://orioninsist.com/sitemap.xml' /tmp/orioninsist-preview/robots.txt

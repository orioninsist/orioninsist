name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.27.2
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Install Hugo extended 0.168.0
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          go version
          hugo version
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Fetch latest RSS posts and videos
        run: python3 scripts/fetch_updates.py
      - name: Build single-page website
        run: hugo --minify
      - name: Verify one public HTML page
        run: |
          test -s public/index.html
          test "$(find public -name '*.html' | wc -l)" -eq 1
          grep -q 'SOC Analyst Journey' public/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
